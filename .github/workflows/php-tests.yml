name: PHP tests

on:
  pull_request:
  push:
    branches:
      - trunk

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php }}, WP ${{ matrix.wp }}, WC ${{ matrix.wc }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # Support policy: WordPress and WooCommerce L, L-1, and L-2. The oldest PHP runs with the oldest versions.
      matrix:
        include:
          - php: '7.4'
            wp: L-2
            wc: L-2
          - php: '8.3'
            wp: L-1
            wc: L-1
          - php: '8.4'
            wp: L
            wc: L
          - php: '8.5'
            wp: L
            wc: L
          - php: '8.5'
            wp: L-1
            wc: L-1
          - php: '8.5'
            wc: L-2
            wp: L-2

    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: '.nvmrc'

      - name: Node cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            node_modules
            ~/.npm
          key: node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            node-

      - name: Node install
        run: npm ci

      # Composer resolves for PHP 7.4 (config.platform), so the host PHP version does not need to match the matrix.
      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # 2.37.1
        with:
          php-version: 7.4
          tools: composer
          coverage: none

      - name: Get composer cache directory
        id: composer-cache
        run: echo "dir=$(composer config cache-files-dir)" >> $GITHUB_OUTPUT

      - name: Composer cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ${{ steps.composer-cache.outputs.dir }}
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Composer install
        run: composer install --no-progress

      - name: Set WordPress and WooCommerce versions
        run: node tests/phpunit/bin/set-versions.js --wp=${{ matrix.wp }} --wc=${{ matrix.wc }}

      - name: Start the PHPUnit environment
        run: npm run test:php:env:start
        env:
          WP_ENV_PHP_VERSION: ${{ matrix.php }}

      - name: Run PHPUnit
        run: npm run test:php
