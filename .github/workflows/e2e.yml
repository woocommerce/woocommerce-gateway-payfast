name: E2E test

on:
  push:
    branches:
      - smoke-testing
  pull_request:
    types: [ opened, synchronize, reopened, labeled ]
    branches:
      - trunk

jobs:
  e2e:
    if: "${{ ( github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'needs: e2e testing') ) ||  github.event_name == 'push' }}"
    name: E2E Test
    runs-on: ubuntu-latest
    env:
      PAYFAST_MERCHANT_ID: ${{secrets.PAYFAST_MERCHANT_ID}}
      PAYFAST_MERCHANT_KEY: ${{secrets.PAYFAST_MERCHANT_KEY}}
      PAYFAST_PASSPHRASE: ${{secrets.PAYFAST_PASSPHRASE}}

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@cdca7365b2dadb8aad0a33bc7601856ffabcc48e # v4.3.0
        with:
          node-version-file: '.nvmrc'

      - name: Node cache
        uses: actions/cache@d4323d4df104b026a6aa633fdb11d772146be0bf # v4.2.2
        with:
          path: |
            node_modules
            ~/.npm
          key: node-${{ hashFiles('package-lock.json') }}

      - name: Node install
        run: npm ci

      - name: Build
        run: npm run build

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Set the core version
        if: "${{ contains(github.event.pull_request.labels.*.name, 'needs: WP RC test') }}"
        id: run-rc-test
        run: ./tests/e2e/bin/set-core-version.js WordPress/WordPress#master

      - name: Install required WP plugins
        run: |
          gh release download --repo woocommerce/woocommerce-subscriptions --pattern  woocommerce-subscriptions.zip --dir ./tests/e2e/test-plugins
          cd ./tests/e2e/test-plugins
          unzip -o woocommerce-subscriptions.zip
          cd ../../..
        env:
          GH_TOKEN: ${{ secrets.BOT_GITHUB_TOKEN }}

      - name: Setup WP environment
        run: npm run env:start

      - name: Run E2E Foundational Test
        id: payfast_e2e_tests
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          rm -rf ./tests/e2e/test-plugins/woocommerce-subscriptions/tests
          npm run test:e2e-foundational

      - name: Update Success Label
        if: |
          always() &&
          steps.payfast_e2e_tests.conclusion == 'success'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        continue-on-error: true
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: ['needs: e2e testing']
            })
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['status: e2e tests passing']
            })
      - name: Update Failure Label
        if: |
          always() &&
          steps.payfast_e2e_tests.conclusion == 'failure'
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7.0.1
        continue-on-error: true
        with:
          script: |
            github.rest.issues.removeLabel({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              name: ['needs: e2e testing']
            })
            github.rest.issues.addLabels({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              labels: ['status: e2e tests failing']
            })
      - name: Run E2E Smoke Test
        if: ${{ github.event_name == 'push' }}
        run: npm run test:e2e

      - uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        if: always()
        with:
          name: playwright-report
          path: tests/e2e/test-results/report
          retention-days: 2
